<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Register

</title>

<link rel="stylesheet"
href="auth.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<div class="container">

<div class="card">

<h1>

Create Account

</h1>

<p>

Join StorageApp

</p>

<form id="registerForm">

<div class="inputBox">

<i class="fa fa-user"></i>

<input
type="text"
id="name"
placeholder="Full Name"
required>

</div>

<div class="inputBox">

<i class="fa fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email"
required>

</div>

<div class="inputBox">

<i class="fa fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

</div>

<div class="inputBox">

<i class="fa fa-lock"></i>

<input
type="password"
id="confirm"
placeholder="Confirm Password"
required>

</div>

<button type="submit">

Create Account

</button>

</form>

<div class="bottom">

Already have account ?

<a href="login.html">

Login

</a>

</div>

</div>

</div>

<script src="auth.js"></script>

</body>

</html>
