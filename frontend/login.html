<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet"
href="auth.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<div class="container">

<div class="card">

<h1>

StorageApp

</h1>

<p>

Sign in to continue

</p>

<form
id="loginForm"
autocomplete="off">

<div class="inputBox">

<i class="fa fa-envelope"></i>

<input
type="email"
id="email"
name="login_email"
placeholder="Email"
autocomplete="off"
spellcheck="false"
required>

</div>

<div class="inputBox">

<i class="fa fa-lock"></i>

<input
type="password"
id="password"
name="login_password"
placeholder="Password"
autocomplete="new-password"
required>

</div>

<div class="options">

<label>

<input
type="checkbox"
id="remember">

Remember me

</label>

<a href="#">

Forgot password ?

</a>

</div>

<button type="submit">

Login

</button>

</form>

<div class="bottom">

Don't have an account ?

<a href="register.html">

Register

</a>

</div>

</div>

</div>

<script src="auth.js"></script>

</body>

</html>
